[project]
name = "casechamp-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "jsonschema[format]>=4.26,<5",
    "ortools>=9.14,<10",
    "pillow>=11.3,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
ml = [
    "open-clip-torch==3.3.0",
    "torch==2.8.0",
    "transformers==4.57.6",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "hypothesis>=6.130,<7", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
