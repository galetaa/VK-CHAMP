      summary: Создать изолированный демо магазин и OWNER
      tags:
      - P0
      x-roles:
      - BOOTSTRAP
      x-idempotency-required: true
      security:
      - bootstrapCookie: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]+$
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          minLength: 36
          maxLength: 36
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      responses:
        '201':
          description: Успешный результат; на replay тот же data и исходный успешный
            HTTP status, новый meta с replayed=true.
          content:
            application/json:
