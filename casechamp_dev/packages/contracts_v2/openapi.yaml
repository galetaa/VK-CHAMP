openapi: 3.1.0
info:
  title: Первый заказ из сообщества API
  version: 2.0.0
  description: Спецификация демонстрационного продукта. Все заказы DEMO; native_vk_order_id
    и paid_at null. Integer tokens проверяются строго до coercion; JSON Schema отдельно
    не запрещает 1.0. Цены в копейках RUB.
