      x-idempotency-required: false
      security: []
      parameters: []
      responses:
        '200':
          description: Успешный результат; на replay тот же data и исходный успешный
            HTTP status, новый meta с replayed=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '400':
          description: Строгая ошибка; применимые коды описаны в error_codes.csv и
